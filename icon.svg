    <rect x="-4" y="-16" width="8" height="18" rx="3" fill="#ffb020" stroke="#3b3fd8" stroke-width="3"/>
    <rect x="-8" y="-22" width="16" height="9" rx="4" fill="#ffb020" stroke="#3b3fd8" stroke-width="3"/>
