      <stop offset="0" stop-color="#3b3fd8"/>
      <stop offset="1" stop-color="#6c8cf5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#uwBg)"/>
  <!-- floating monitor window -->
